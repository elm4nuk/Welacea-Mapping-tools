    doi_record: 10.5281/zenodo.5914554
    crops: [tree_canopy]
    task: "deteksi tajuk pohon individual (hutan), kelas `Tree`"
    platform: "Citra RGB PESAWAT NEON AOP (±10 cm/px), bukan UAV; + LiDAR, hiperspektral, CHM"
    annotation_format: "Pascal VOC XML per tile (`<object><name>Tree</name><bndbox>xmin..</bndbox>`), piksel"
