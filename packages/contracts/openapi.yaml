          - check
          - gap
          title: Kind
        note:
          type: string
          maxLength: 1000
          title: Note
        review_status:
          type: string
          enum:
          - pending
          - accepted
          - rejected
          title: Review Status
        geometry_type:
          type: string
          enum:
          - point
          - bbox
          title: Geometry Type
        x:
