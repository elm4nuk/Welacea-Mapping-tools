          title: Product Type
          description: GeoTIFF bergeoreferensi yang diimpor pengguna. BUKAN orthomosaic yang dibuat/diverifikasi WALLACEA;
            georeferensi diambil apa adanya dari berkas.
        is_verified_orthomosaic:
          type: boolean
          const: false
          title: Is Verified Orthomosaic
          description: 'Selalu false di revisi 5: sumber/proses raster tidak diverifikasi aplikasi.'
          default: false
