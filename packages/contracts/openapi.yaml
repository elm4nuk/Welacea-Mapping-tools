    ModelStatus:
      properties:
        state:
          type: string
          enum:
          - not_configured
          - configured
          - loaded
          - error
          title: State
          description: 'not_configured: tidak ada bobot; configured: bobot ada, belum dimuat; loaded: sudah dimuat di memori;
            error: konfigurasi/dependensi bermasalah.'
        available:
          type: boolean
          title: Available
          description: True bila analyze dapat dicoba (state configured/loaded).
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
        model_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Version
          description: Sidik jari bobot (sha256 terpotong) bila diketahui.
        message:
          type: string
          title: Message
        adapter:
          anyOf:
          - type: string
            enum:
            - ultralytics
            - deepforest
            - simulation
          - type: 'null'
          title: Adapter
          description: 'Jenis detector aktif. null bila mode manual / konfigurasi salah. Revisi 4: `simulation`.'
        target:
          anyOf:
          - type: string
            enum:
            - plant
            - tree_crown
            - simulation
          - type: 'null'
          title: Target
          description: Objek yang dideteksi model. tree_crown = tajuk pohon (DeepForest pretrained), BUKAN semua tanaman.
            simulation (revisi 4) = kotak buatan, BUKAN AI. Kandidat tetap disimpan sebagai kind=plant (lihat Annotation.model_label).
        target_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Label
          description: Teks siap tampil, mis. 'Kandidat tajuk pohon (DeepForest pretrained)'.
        device:
          anyOf:
          - type: string
          - type: 'null'
          title: Device
          description: cpu | cuda | auto. Inferensi CPU dapat memakan puluhan detik per foto besar.
        limitations:
          items:
            type: string
          type: array
          title: Limitations
          description: Keterbatasan model yang perlu ditampilkan ke pengguna.
        mode:
          type: string
          enum:
          - manual
          - model
          - simulation
          title: Mode
          description: 'manual: tanpa model (penandaan manual saja); model: detector model sungguhan (state menjelaskan siap/tidak);
            simulation: WALLACEA_DETECTOR=simulation — kandidat SIMULASI, BUKAN AI. UI wajib menampilkan target_label/message
            bila mode=simulation.'
          default: model
        diagnostic_code:
          anyOf:
          - type: string
            enum:
            - MODEL_PATH_NOT_SET
            - DETECTOR_CONFIG_INVALID
            - MODEL_FILE_NOT_FOUND
            - MODEL_FILE_NOT_PT
            - MODEL_FILES_INCOMPLETE
            - DEPENDENCY_MISSING
            - LABEL_MAP_INVALID
            - LABEL_MAP_MISMATCH
            - NOT_DETECTION_MODEL
            - MODEL_LOAD_FAILED
            - GENERIC_COCO_MODEL
            - SIMULATION_ACTIVE
          - type: 'null'
          title: Diagnostic Code
          description: Alasan status yang bisa dibaca mesin (mis. MODEL_FILE_NOT_FOUND, DEPENDENCY_MISSING, LABEL_MAP_MISMATCH,
            SIMULATION_ACTIVE). null = model siap tanpa catatan. Teks untuk pengguna tetap di `message`.
      type: object
      required:
      - state
      - available
      - message
      title: ModelStatus
