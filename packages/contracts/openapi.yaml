        schema:
          type: integer
          minimum: 0
          title: X
      - name: y
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
          title: Y
      responses:
        '200':
          description: PNG
          content:
            image/png: {}
        '404':
          description: Tidak ditemukan (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validasi gagal (VALIDATION_ERROR, DETECTION_MISMATCH, ANNOTATION_LIMIT_EXCEEDED, INVALID_GEOMETRY,
            RASTER_NOT_GEOREFERENCED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Model/paket tidak tersedia (MODEL_NOT_CONFIGURED, MODEL_UNAVAILABLE, MAPPING_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/rasters/{raster_id}/analyze:
    post:
      tags:
      - rasters
      summary: Jalankan model aktif pada raster per jendela (sinkron) → kandidat peta pending berkoordinat WGS84
      description: Jendela `tile_size` px ber-overlap `overlap_px`, opsional resize `scale`. Posisi dikembalikan ke piksel
        raster asal, lalu transform raster + CRS → WGS84 (pyproj always_xy, [lon, lat]). Duplikat antarjendela dihapus (NMS
        per kind, IoU/IoS; lihat parameters.dedup). Kandidat selalu pending. Batas waktu total `limits.raster_analysis_timeout_s`
        → 504 INFERENCE_TIMEOUT.
      operationId: analyze_raster
      parameters:
      - name: raster_id
        in: path
        required: true
        schema:
          type: string
          title: Raster Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RasterAnalyzeRequest'
              - type: 'null'
              title: Body
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RasterAnalysisResult'
        '404':
          description: Tidak ditemukan (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Konflik (REVISION_CONFLICT, ANALYSIS_EXISTS, ANALYSIS_IN_PROGRESS, DEMO_SURVEY_READONLY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validasi gagal (VALIDATION_ERROR, DETECTION_MISMATCH, ANNOTATION_LIMIT_EXCEEDED, INVALID_GEOMETRY,
            RASTER_NOT_GEOREFERENCED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan server (INTERNAL_ERROR, INFERENCE_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Model/paket tidak tersedia (MODEL_NOT_CONFIGURED, MODEL_UNAVAILABLE, MAPPING_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '504':
          description: Inferensi melewati batas waktu (INFERENCE_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/rasters/{raster_id}/analysis-runs:
