          type: integer
          title: Width
        height:
          type: integer
          title: Height
        band_count:
          type: integer
          title: Band Count
        crs:
          $ref: '#/components/schemas/RasterCrs'
        transform:
          items:
            type: number
          type: array
          title: Transform
          description: 'Affine [a, b, c, d, e, f]: x = a·col + b·row + c, y = d·col + e·row + f; (col,row)=(0,0) sudut kiri-atas
            piksel pertama.'
        bounds_native:
          items:
            type: number
          type: array
          title: Bounds Native
          description: '[left, bottom, right, top] dalam CRS raster'
        bounds_wgs84:
          items:
            type: number
          type: array
          title: Bounds Wgs84
          description: '[west, south, east, north]'
        footprint:
          $ref: '#/components/schemas/GeoJsonPolygon'
          description: Batas raster (tepi didensifikasi) dalam WGS84.
        footprint_area_m2:
          type: number
          title: Footprint Area M2
        approx_gsd_m:
          type: number
          title: Approx Gsd M
          description: Perkiraan ukuran piksel di tanah (m) di pusat raster.
        nodata:
          anyOf:
          - type: number
          - type: 'null'
          title: Nodata
        has_alpha:
          type: boolean
          title: Has Alpha
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: colorinterp, mask_flags, compression, is_rotated, warnings.
        processing:
          additionalProperties: true
          type: object
          title: Processing
          description: 'Pipeline impor: turunan tampilan, overview, versi rasterio/GDAL.'
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        content_url:
          type: string
          title: Content Url
        preview_url:
          type: string
          title: Preview Url
        tilejson_url:
          type: string
          title: Tilejson Url
        tile_url_template:
          type: string
          title: Tile Url Template
          description: XYZ EPSG:3857, PNG 256 px, area di luar raster transparan.
        minzoom:
          type: integer
          title: Minzoom
        maxzoom:
          type: integer
          title: Maxzoom
        detection_counts:
          $ref: '#/components/schemas/RasterDetectionCounts'
        revision:
          type: integer
          title: Revision
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - survey_id
      - name
      - original_name
      - product_type
      - source_description
      - size_bytes
      - sha256
      - width
      - height
      - band_count
      - crs
      - transform
      - bounds_native
      - bounds_wgs84
      - footprint
      - footprint_area_m2
      - approx_gsd_m
      - nodata
      - has_alpha
      - metadata
      - processing
      - warnings
      - content_url
      - preview_url
      - tilejson_url
      - tile_url_template
      - minzoom
      - maxzoom
      - detection_counts
      - revision
      - created_at
      - updated_at
