components:
  schemas:
    AnalysisResult:
      properties:
        run:
          $ref: '#/components/schemas/AnalysisRun'
        candidates:
          items:
            $ref: '#/components/schemas/Annotation'
          type: array
          title: Candidates
          description: Semua kandidat review_status=pending, source=model.
        replaced_annotation_ids:
          items:
            type: string
          type: array
          title: Replaced Annotation Ids
        notice:
          type: string
          title: Notice
      type: object
      required:
      - run
      - candidates
      - replaced_annotation_ids
      - notice
      title: AnalysisResult
    AnalysisRun:
      properties:
        id:
          type: string
          title: Id
        photo_id:
          type: string
          title: Photo Id
        run_type:
          type: string
          enum:
          - inference
          - import
          title: Run Type
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
        model_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Version
        input_sha256:
          type: string
          title: Input Sha256
        status:
          type: string
          enum:
          - running
          - succeeded
          - failed
          title: Status
        candidate_count:
          type: integer
          title: Candidate Count
        parameters:
          additionalProperties: true
          type: object
          title: Parameters
        started_at:
          type: string
          format: date-time
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        target:
          anyOf:
          - type: string
            enum:
            - plant
            - tree_crown
            - simulation
          - type: 'null'
          title: Target
          description: 'Arti bbox kandidat run ini: plant = tanaman (model tim), tree_crown = tajuk pohon (DeepForest pretrained),
            simulation = SIMULASI BUKAN AI (revisi 4). null = tidak diketahui (mis. impor, run lama) → pakai istilah generik.'
      type: object
      required:
      - id
      - photo_id
      - run_type
      - model_id
      - model_version
      - input_sha256
      - status
      - candidate_count
      - parameters
      - started_at
      - finished_at
      - error_code
      title: AnalysisRun
    AnalysisRunPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AnalysisRun'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - items
      - total
      - limit
      - offset
      title: AnalysisRunPage
    AnalyzeRequest:
      properties:
        on_existing:
          type: string
          enum:
          - reject
          - replace_pending
          - append
          title: On Existing
          description: 'Bila foto sudah punya run sukses dengan model+versi yang sama: reject → 409 ANALYSIS_EXISTS; replace_pending
            → hapus kandidat pending dari run lama foto ini lalu tambah yang baru; append → tambah tanpa menghapus.'
          default: reject
      additionalProperties: false
      type: object
      title: AnalyzeRequest
    Annotation:
      properties:
        id:
          type: string
          title: Id
        photo_id:
          type: string
          title: Photo Id
        analysis_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Analysis Run Id
        kind:
          type: string
          enum:
          - plant
          - check
          - gap
          title: Kind
        geometry_type:
          type: string
          enum:
          - point
          - bbox
          title: Geometry Type
        x:
          type: number
          title: X
        y:
          type: number
          title: Y
        bbox:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Bbox
        source:
          type: string
          enum:
          - manual
          - model
          title: Source
        review_status:
          type: string
          enum:
          - pending
          - accepted
          - rejected
          title: Review Status
        confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence
