        overlap_px:
          type: integer
          maximum: 2048.0
          minimum: 0.0
          title: Overlap Px
          description: Overlap antarjendela; harus ≥ ukuran objek terbesar dan < tile_size.
          default: 128
        scale:
          type: number
          maximum: 4.0
          minimum: 0.1
          title: Scale
          description: Faktor resize jendela sebelum ke model (mis. 0.5).
          default: 1.0
        iou_threshold:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0.0
          title: Iou Threshold
          default: 0.5
        ios_threshold:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0.0
          title: Ios Threshold
          description: Intersection / area kotak terkecil untuk dedup.
          default: 0.8
      additionalProperties: false
      type: object
      title: RasterAnalyzeRequest
    RasterAsset:
      properties:
        id:
          type: string
          title: Id
        survey_id:
          type: string
          title: Survey Id
        name:
          type: string
          title: Name
        original_name:
          type: string
          title: Original Name
        product_type:
          type: string
