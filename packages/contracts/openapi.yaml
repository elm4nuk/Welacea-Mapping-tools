          title: Survey Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyReport'
        '404':
          description: Tidak ditemukan (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/surveys/{survey_id}/export.csv:
    get:
      tags:
      - reports
      summary: Ekspor semua penanda survei sebagai CSV
      operationId: export_csv
      parameters:
      - name: survey_id
        in: path
        required: true
        schema:
          type: string
          title: Survey Id
      responses:
        '200':
          description: CSV UTF-8 (dengan BOM), satu baris per penanda
          content:
            text/csv: {}
        '404':
          description: Tidak ditemukan (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/imports/starter-backup:
    post:
      tags:
      - imports
      summary: Impor backup JSON starter v0.1 (schemaVersion 1) sebagai salinan survei baru
      operationId: import_starter_backup
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_import_starter_backup'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StarterBackupImportResult'
        '400':
          description: Permintaan/berkas tidak valid (BAD_REQUEST, INVALID_IMAGE, INVALID_BACKUP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Terlalu besar (PAYLOAD_TOO_LARGE, IMAGE_TOO_LARGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: Format tidak didukung (UNSUPPORTED_MEDIA_TYPE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
